[project]
name = "quadrantes-legislativos"
version = "0.1.0"
description = "Quadrantes da Produtividade Legislativa — custo de mandato x produtividade de deputados federais"
readme = "README.md"
requires-python = ">=3.12"
# license: em aberto no PRD ("Licença do código e dos dados"). O README declara
# MIT, mas não há LICENSE no repositório — decisão pendente, não presumida aqui.

# Dependências de execução. Tudo que `legisdata` e o dashboard importam precisa
# estar aqui — `requests` só funcionava por ser dependência transitiva do
# streamlit — e nada além disso: cada linha aqui vira uma instalação no build do
# Streamlit Cloud, e uma que falhe derruba o deploy inteiro.
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.26.2",
]

# O projeto não é distribuído como pacote instalável — é uma aplicação. O uv
# gerencia apenas o ambiente, e o pytest resolve `legisdata` pela raiz.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
